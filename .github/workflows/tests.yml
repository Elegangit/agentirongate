name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,live,plots]'
      - run: python -m ruff check src tests
      - run: python -m pytest
      - run: python -m gatebench identity
      - run: git diff --exit-code -- README.md
      - run: python -m gatebench run --output outputs/ci
      - run: python -m gatebench analyze outputs/ci
      - run: python -m gatebench plot outputs/ci
