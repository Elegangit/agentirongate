# Live pilot through OpenRouter. Set OPENROUTER_API_KEY in your shell.
# Models were chosen from a prefix-only eligibility screen, before any branch outcomes.
# Request cap: 12 attack tasks x 2 models x (6 prefix + 5 repeats x 3 conditions x 6 calls) = 2,304.
seed = 17
repeats = 5
conditions = ["minimal", "rule", "directed"]
prefix_calls = 6
branch_calls = 6
branch_proposals = 6
max_api_calls = 2304
feedback_scope = "persistent"
approver = "ideal"
bootstrap_samples = 2000

[[models]]
id = "deepseek-v4-flash"
provider = "openrouter"
model = "deepseek/deepseek-v4-flash"
temperature = 0.0
max_output_tokens = 4096

[[models]]
id = "gemini-2-5-flash"
provider = "openrouter"
model = "google/gemini-2.5-flash"
temperature = 0.0
max_output_tokens = 4096
